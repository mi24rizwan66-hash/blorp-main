<body><header><a class="logo" href="#home">BLORP<span>_</span></a><nav aria-label="Main navigation"><a href="#lab">Lab</a><a href="#models">Models</a><a href="#experiments">Experiments</a><a href="#pricing">Pricing</a><a href="#developers">Developers</a><a href="#about">About</a></nav><div class="header-actions"><button class="outline" data-action="signin">Sign in</button><a class="button primary" href="#lab">Enter lab <span>→</span></a></div><button class="menu outline" aria-label="Toggle menu" aria-expanded="false">☰</button></header>
<main id="app"></main><footer><a class="logo" href="#home">BLORP_</a><span>Human ideas. Machine intelligence. A better tomorrow.</span><a href="#status"><i class="dot"></i> System status</a><small>Frontend preview · v0.1.0</small></footer>
<dialog id="modal"><button class="close outline" aria-label="Close dialog">×</button><div id="modal-content"></div></dialog><div id="toast" role="status"></div><button class="motion-switch outline" aria-label="Toggle animation" aria-pressed="true">◉ Motion: ON</button><script>let chatTranscript=[],chatGeneration=0,chatBusy=false,blorpTransport=null;
/*
Backend integration: call window.BLORP.connect(async ({message,model,mode}) => {
  const response = await fetch('/api/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message,model,mode})
  });
  if(!response.ok) throw new Error('Request failed');
  const data=await response.json();
  return data.reply;
});
Keep API keys on your server. This file makes no AI/payment/authentication requests by default.
*/
window.BLORP={connect(handler){if(typeof handler!=='function')throw new TypeError('Expected an async response handler');blorpTransport=handler;document.querySelectorAll('.lab-main > .notice').forEach(n=>n.textContent='Connected to your configured backend.');},disconnect(){blorpTransport=null;}};
const app=document.querySelector('#app'),modal=document.querySelector('#modal');
const models=[['ϟ','Fast','Quick everyday intelligence.'],['⬡','Core','Balanced general-purpose AI.'],['♧','Reason','Advanced reasoning and planning.'],['〈/〉','Code','Programming and debugging.'],['◉','Vision','Image understanding.'],['⌕','Research','Structured research and analysis.'],['✧','Creative','Ideas, writing and branding.'],['✦','Max','Most capable premium model.']];
const plans=[{name:'Free',price:0,features:['20 AI messages/day','BLORP Fast','Basic chat','Limited history','Standard speed']},{name:'Core',price:100,features:['100 AI messages/day','BLORP Fast','BLORP Core','BLORP Code','File uploads','Longer history','Faster responses']},{name:'Pro',price:299,badge:'MOST POPULAR',features:['500 AI messages/day','BLORP Core','BLORP Reason','BLORP Code','BLORP Vision','BLORP Research','BLORP Creative','Projects & saved prompts','Priority responses']},{name:'Lab+',price:599,badge:'MAXIMUM POWER',features:['1500 AI messages/day','All BLORP models','BLORP Max','Higher file limits','Deep reasoning','Advanced analytics','Priority experiments','Priority processing']},{name:'Founders Lifetime',price:9996,badge:'LIMITED OFFER',features:['All BLORP models','Current premium features','Future models & updates','Highest usage tier','Priority processing','Founders badge','No monthly renewal']}];
let yearly=false,selectedModel='Core',mode='Reason';
const escapeHTML=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function modelOptions(){return models.map(m=>`<option ${selectedModel===m[1]?'selected':''}>BLORP ${m[1]}</option>`).join('')}
function modelCards(){return `<div class="models">${models.map(m=>`<article class="card"><span class="model-icon" aria-hidden="true">${m[0]}</span><h3>BLORP ${m[1]}</h3><p>${m[2]}</p><button class="button" data-model="${m[1]}">Try now <span>→</span></button></article>`).join('')}</div>`}
function pricing(){return `<section class="section"><div class="section-top"><div><div class="eyebrow">Choose your plan</div><h2>Power your ideas</h2><p>More intelligence. More possibilities. A better you.</p></div><div class="toggle" aria-label="Billing period"><button data-billing="monthly" class="${!yearly?'selected':''}" aria-pressed="${!yearly}">Monthly</button><button data-billing="yearly" class="${yearly?'selected':''}" aria-pressed="${yearly}">Yearly (save 20%)</button></div></div><div class="plans">${plans.map((p,i)=>`<article class="card plan ${i===2?'popular':''} ${i===4?'gold':''}">${p.badge?`<span class="badge">${p.badge}</span>`:'<span class="badge" style="visibility:hidden">MEMBERSHIP</span>'}<h3>${p.name.toUpperCase()}</h3><div class="price">₹${(yearly&&i>0&&i<4?Math.round(p.price*12*.8):p.price).toLocaleString('en-IN')} <small>${i===4?'one-time':yearly&&i>0?'/ year':i===0?'':'/ month'}</small></div><ul>${p.features.map(f=>`<li>${f}</li>`).join('')}</ul><button class="button ${i===2?'primary':''}" data-plan="${i}">${i===0?'Get started':i===4?'Get lifetime access':'Choose plan'}</button></article>`).join('')}</div><p class="notice">Membership preview. Checkout is not connected and no payments are collected.</p></section>`}
function home(){return `<section class="hero"><div class="reactor" role="img" aria-label="Blue illuminated mechanical reactor from the BLORP design reference"></div><div class="particles">${Array.from({length:20},(_,i)=>`<i style="left:${i*5+2}%;top:${i%4*13}%;animation-delay:-${i*.71}s;animation-duration:${5+i%5}s"></i>`).join('')}</div><div class="core-glow"></div><div class="hero-copy"><div class="eyebrow">// Experimental AI laboratory</div><h1>Intelligence,<br><span>Engineered.</span></h1><p>Build, test and interact with next-generation<br>AI systems inside one living intelligence laboratory.</p><div class="actions"><a href="#lab" class="button primary">Enter the lab →</a><button class="outline" data-action="watch">Watch system ◉</button></div><div class="stats"><div><strong>1M+</strong><small>Experiments</small></div><div><strong>99.99%</strong><small>System uptime</small></div><div><strong>120ms</strong><small>Avg response</small></div><div><strong>24/7</strong><small>Neural core</small></div></div></div></section><form class="prompt-bar" id="home-prompt"><span aria-hidden="true">♧</span><input aria-label="Ask BLORP anything" placeholder="Ask BLORP anything…" required><select aria-label="Select model">${modelOptions()}</select>${['Reason','Code','Vision','Research'].map(m=>`<button type="button" class="mode ${m===mode?'selected':''}" data-mode="${m}">${m}</button>`).join('')}<button class="send" aria-label="Send prompt">↑</button></form><section class="section divider"><div class="section-top"><div><div class="eyebrow">Specialized intelligence for every idea</div><h2>BLORP models</h2></div><a href="#models">Explore all models →</a></div>${modelCards()}</section>${pricing()}`}
function lab(){return `<section class="lab"><aside class="sidebar"><button class="primary" data-action="newchat">＋ New chat</button><a href="#lab">◌ &nbsp; Chat</a><button data-model="Code">〈/〉 &nbsp; Code</button><button data-model="Vision">◉ &nbsp; Vision</button><button data-model="Research">⌕ &nbsp; Research</button><span class="label">WORKSPACE</span><button data-action="projects">▧ &nbsp; Projects</button><button data-action="history">◷ &nbsp; History</button><button data-action="saved">▣ &nbsp; Saved</button><a href="#models">⬡ &nbsp; Models</a><span class="label">RESOURCES</span><a href="#developers">⌘ &nbsp; API access</a><a href="#status">◉ &nbsp; System status</a></aside><div class="lab-main"><div class="eyebrow">BLORP / AI LAB</div><p>Welcome to your laboratory.</p><h2>What do you want to build?</h2><div id="messages" aria-live="polite"></div><form id="chat-form" class="composer"><textarea aria-label="Your prompt" placeholder="Ask BLORP anything…" required></textarea><div class="composer-bottom"><select aria-label="Select model">${modelOptions()}</select>${['Research','Vision','Code','Reason'].map(m=>`<button type="button" class="mode ${mode===m?'selected':''}" data-mode="${m}">${m}</button>`).join('')}<button class="send" aria-label="Send message">↑</button></div></form><p class="notice">Interactive frontend demo — no AI service is connected.</p><div class="card graph"><h3>Live reasoning graph <small class="notice">· illustrative animation</small></h3><div class="nodes"><span class="node">◉ User input</span><span>→</span><span class="node">⬡ Planner</span><span>→</span><span class="node">⌕ Search</span><span>→</span><span class="node">✧ BLORP ${selectedModel}</span></div></div><div class="telemetry"><div><small>Core load · demo</small><strong>◔ 32%</strong></div><div><small>Memory · demo</small><strong class="bars">▂▆▅█▃</strong><span>5.2 GB</span></div><div><small>Token flow · demo</small><strong class="bars">▃▂█▅▇</strong><span>12.4K / min</span></div><div><small>Latency · demo</small><strong>120ms</strong></div></div></div></section>`}
function status(){return `<section class="section status-list"><div class="page-heading"><div class="eyebrow">BLORP / System</div><h1>System status</h1><p><i class="dot"></i>All systems operational · demo</p><p class="notice">Illustrative status data from the reference, not live service monitoring.</p></div><div class="card">${['BLORP Chat','Code','Vision','Research','Authentication','Database','Payment verification'].map(x=>`<div class="status-row"><span><i class="dot"></i>${x}</span><span>Operational</span><span>99.99%</span></div>`).join('')}</div></section>`}
function render(){const route=location.hash.slice(1)||'home';document.querySelector('nav').classList.remove('open');document.querySelector('.menu').setAttribute('aria-expanded','false');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash===`#${route}`));if(route==='home')app.innerHTML=home();else if(route==='pricing')app.innerHTML=pricing();else if(route==='models')app.innerHTML=`<section class="section"><div class="page-heading"><div class="eyebrow">Specialized intelligence for every idea</div><h1>BLORP models</h1><p>Choose the right intelligence for what comes next.</p></div>${modelCards()}</section>`;else if(route==='lab')app.innerHTML=lab();else if(route==='status')app.innerHTML=status();else if(route==='experiments')app.innerHTML=`<section class="section"><div class="page-heading"><div class="eyebrow">Inside the laboratory</div><h1>Experiments</h1><p>Explore the interfaces behind BLORP.</p></div><div class="content-grid">${[['Reasoning graph','Explore the animated path from input to response.','watch'],['Neural core','Control the reactor animation in the system viewer.','watch'],['Model playground','Select a model and compose your first prompt.','play']].map(x=>`<article class="card"><span class="model-icon">⬡</span><h3>${x[0]}</h3><p>${x[1]}</p><button data-action="${x[2]}">Launch experiment →</button></article>`).join('')}</div></section>`;else if(route==='developers')app.innerHTML=`<section class="section"><div class="page-heading"><div class="eyebrow">Build with BLORP</div><h1>Developer access</h1><p>The API is not available yet. This project currently contains the frontend experience.</p></div><div class="card"><h3>Backend integration</h3><p>Connect your server to the chat form handler. Keep provider keys on your server.</p><pre><code>POST /api/chat\n{ "model": "core", "message": "Your prompt" }</code></pre><p class="notice">Proposed request format — no endpoint is deployed.</p><a class="button" href="#lab">Explore the frontend →</a></div></section>`;else if(route==='about')app.innerHTML=`<section class="section"><div class="page-heading"><div class="eyebrow">// Experimental AI laboratory</div><h1>Human ideas.<br><span>Machine intelligence.</span></h1><p>BLORP brings chat, code, reasoning, vision and research into one living intelligence laboratory.</p></div><div class="card"><h3>A better tomorrow.</h3><p>Build, test and interact with next-generation AI systems. This preview demonstrates the interface and motion design for the BLORP platform.</p><a class="button primary" href="#lab">Enter the lab →</a></div></section>`;else app.innerHTML=`<section class="section"><h1>Page not found</h1><p><a href="#home">Return home →</a></p></section>`;window.scrollTo(0,0)}
function openModal(html){document.querySelector('#modal-content').innerHTML=html;modal.showModal()}
function notify(s){const t=document.querySelector('#toast');t.textContent=s;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',4000)}
function addMessage(text,type){chatTranscript.push({text,type});const box=document.querySelector('#messages');if(box){const d=document.createElement('div');d.className='message '+type;d.textContent=text;box.append(d)}}
async function sendPrompt(text){
 const generation=chatGeneration,requestModel=selectedModel,requestMode=mode;
 addMessage(text,'user');
 if(!blorpTransport){addMessage('BLORP '+requestModel+' · Frontend preview\n\nYour prompt is ready. Connect your backend to enable AI responses.','assistant');return;}
 if(chatBusy){addMessage('Please wait for the current response.','assistant');return;}
 chatBusy=true;document.querySelector('#chat-form')?.setAttribute('aria-busy','true');
 try{const reply=await blorpTransport({message:text,model:requestModel,mode:requestMode});
 if(typeof reply!=='string')throw Error('Backend must return a text response.');
 if(generation===chatGeneration)addMessage(reply,'assistant');
 }catch(error){if(generation===chatGeneration)addMessage('The response could not be completed. Please try again.','assistant');}
 finally{chatBusy=false;document.querySelector('#chat-form')?.removeAttribute('aria-busy');}
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.matches('.close'))modal.close();if(b.matches('.menu')){const open=document.querySelector('nav').classList.toggle('open');b.setAttribute('aria-expanded',String(open))}if(b.dataset.model){selectedModel=b.dataset.model;if(location.hash==='#lab')render();else location.hash='lab'}if(b.dataset.mode){mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>{x.classList.toggle('selected',x.dataset.mode===mode);x.setAttribute('aria-pressed',String(x.dataset.mode===mode))})}if(b.dataset.billing){yearly=b.dataset.billing==='yearly';const y=scrollY;render();window.scrollTo(0,y)}if(b.dataset.plan){const i=Number(b.dataset.plan),p=plans[i];if(i===0){location.hash='lab';return}openModal(`<div class="eyebrow">Membership / Preview</div><h2>${p.name}</h2><div class="payment-summary">₹${(yearly&&i<4?Math.round(p.price*12*.8):p.price).toLocaleString('en-IN')} ${i===4?'one-time':yearly?'/ year':'/ month'}</div><p>Your plan selection works. Payment processing has not been connected.</p><p class="notice">No QR code or payment request is generated. Close this preview to continue exploring.</p><button class="primary" data-action="continue">Explore the lab →</button>`)}switch(b.dataset.action){case 'signin':openModal(`<div class="eyebrow">Welcome back</div><h2>Sign in to BLORP</h2><p>Authentication is not connected in this frontend preview.</p><button class="primary" data-action="continue">Continue to demo lab →</button>`);break;case 'continue':modal.close();location.hash='lab';break;case 'play':location.hash='lab';break;case 'newchat':chatTranscript=[];chatGeneration++;render();break;case 'watch':openModal(`<div class="eyebrow">BLORP / Neural core</div><h2>System visualization</h2><div style="height:190px;position:relative;overflow:hidden"><div class="core-glow" style="left:calc(50% - 70px);top:30px;width:140px;height:140px;border:4px double #73bdff;display:grid;place-items:center;font-size:48px">⬡</div></div><p>Illustrative neural-core pulse. Control the live animation below.</p><button data-action="animation" aria-pressed="false">Pause animation</button>`);break;case 'animation':{const core=modal.querySelector('.core-glow'),paused=core.style.animationPlayState==='paused';core.style.animationPlayState=paused?'running':'paused';b.textContent=paused?'Pause animation':'Resume animation';b.setAttribute('aria-pressed',String(!paused));break}case 'projects':case 'history':case 'saved':openModal(`<h2>${b.dataset.action[0].toUpperCase()+b.dataset.action.slice(1)}</h2><div class="empty">Nothing here yet.</div><p>This frontend preview does not save chats or projects.</p>`);break}});
document.addEventListener('change',e=>{if(e.target.tagName==='SELECT'){selectedModel=e.target.value.replace('BLORP ','');notify(`BLORP ${selectedModel} selected`)}});
document.addEventListener('submit',e=>{if(e.target.id==='home-prompt'){e.preventDefault();const value=e.target.querySelector('input').value.trim();if(!value)return;location.hash='lab';render();sendPrompt(value)}else if(e.target.id==='chat-form'){e.preventDefault();const field=e.target.querySelector('textarea'),value=field.value.trim();if(!value)return;sendPrompt(value);field.value=''}});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
window.addEventListener('hashchange',()=>{const existing=app.querySelector('#messages');if(location.hash==='#lab'&&existing)return;render()});render();

/* In-memory chat continuity and efficient interactive reactor animation. */
const baseRender=render;
let motionEnabled=!matchMedia('(prefers-reduced-motion: reduce)').matches,orbitFrame=0,orbitCanvas=null,orbitClock=0,lastFrame=0;
try{const saved=localStorage.getItem('blorp-motion');if(saved==='off')motionEnabled=false;}catch{}
const motionButton=document.querySelector('.motion-switch');
function applyMotion(){document.body.classList.toggle('motion-off',!motionEnabled);motionButton.textContent=motionEnabled?'◉ Motion: ON':'◉ Motion: OFF';motionButton.setAttribute('aria-pressed',String(motionEnabled));cancelAnimationFrame(orbitFrame);lastFrame=0;if(motionEnabled&&!document.hidden&&orbitCanvas)orbitFrame=requestAnimationFrame(drawOrbits);}
motionButton.addEventListener('click',()=>{motionEnabled=!motionEnabled;try{localStorage.setItem('blorp-motion',motionEnabled?'on':'off')}catch{}applyMotion()});
document.addEventListener('visibilitychange',applyMotion);
function drawOrbits(time){if(!orbitCanvas?.isConnected)return;
 const ctx=orbitCanvas.getContext('2d');if(!ctx)return;
 const rect=orbitCanvas.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,1.5),w=rect.width,h=rect.height;
 if(!w||!h)return;
 if(orbitCanvas.width!==Math.round(w*ratio)||orbitCanvas.height!==Math.round(h*ratio)){orbitCanvas.width=Math.round(w*ratio);orbitCanvas.height=Math.round(h*ratio)}
 ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);
 if(lastFrame)orbitClock+=Math.min((time-lastFrame)/1000,.05);lastFrame=time;
 const mobile=w<761,cx=mobile?w*.53:w*.575,cy=mobile?205:Math.min(w*.164+14,275),radius=mobile?110:Math.min(w*.13,200);
 for(let ring=0;ring<3;ring++){
  const tilt=[-.17,.65,-.7][ring],r=radius*(1+ring*.15);
  ctx.beginPath();
  for(let j=0;j<=120;j++){const a=j/120*Math.PI*2,x=Math.cos(a)*r,y=Math.sin(a)*r*.27;
   const px=cx+x*Math.cos(tilt)-y*Math.sin(tilt),py=cy+x*Math.sin(tilt)+y*Math.cos(tilt);
   j?ctx.lineTo(px,py):ctx.moveTo(px,py)}
  ctx.strokeStyle='rgba(66,163,255,'+(ring===0?.35:.13)+')';ctx.lineWidth=1;ctx.stroke();
  for(let k=0;k<3;k++){const a=orbitClock*(.3+ring*.12)+k*Math.PI*2/3,x=Math.cos(a)*r,y=Math.sin(a)*r*.27;
   ctx.beginPath();ctx.arc(cx+x*Math.cos(tilt)-y*Math.sin(tilt),cy+x*Math.sin(tilt)+y*Math.cos(tilt),2.2,0,Math.PI*2);
   ctx.fillStyle='#a7e9ff';ctx.shadowColor='#249aff';ctx.shadowBlur=13;ctx.fill();ctx.shadowBlur=0;}
 }
 if(motionEnabled&&!document.hidden)orbitFrame=requestAnimationFrame(drawOrbits);
}
function enhancePage(){
 const box=document.querySelector('#messages');
 if(box){box.replaceChildren();for(const m of chatTranscript){const d=document.createElement('div');d.className='message '+m.type;d.textContent=m.text;box.append(d)}}
 cancelAnimationFrame(orbitFrame);orbitCanvas=null;const hero=document.querySelector('.hero');
 if(hero){orbitCanvas=document.createElement('canvas');orbitCanvas.className='orbit-canvas';orbitCanvas.setAttribute('aria-hidden','true');hero.append(orbitCanvas);}
 applyMotion();
 if(orbitCanvas&&!motionEnabled)drawOrbits(0);
 if(blorpTransport)document.querySelectorAll('.lab-main > .notice').forEach(n=>n.textContent='Connected to your configured backend.');
}
render=function(){baseRender();enhancePage();};enhancePage();
window.addEventListener('resize',()=>{if(orbitCanvas&&!motionEnabled)drawOrbits(0)});
document.addEventListener('keydown',e=>{if(e.target.matches('#chat-form textarea')&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();e.target.form.requestSubmit()}});
</script></body></html>
